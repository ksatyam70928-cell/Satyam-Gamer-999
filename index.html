<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satyam Gamer 999 Official</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #ff0000;
            --accent2: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, var(--bg), #1e293b);
            color: var(--text);
            line-height: 1.6;
        }

        .hero {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }

        .card {
            background: rgba(17, 24, 39, 0.95);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.4rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 18px;
            font-size: 1rem;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: bold;
            color: white;
        }

        .btn-red { background: var(--accent); }
        .btn-gold { background: var(--accent2); color: #111; }

        .video-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            align-items: start;
        }

        iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 14px;
            background: #000;
        }

        .video-list {
            display: grid;
            gap: 12px;
        }

        .video-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background: #1f2937;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .thumb-box {
            width: 110px;
            flex-shrink: 0;
        }

        .thumb-box img {
            width: 100%;
            border-radius: 8px;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .video-info strong {
            display: block;
            margin-bottom: 2px;
        }

        .video-info a {
            color: #fbbf24;
            text-decoration: none;
        }

        .tag {
            display: inline-block;
            width: fit-content;
            font-size: 0.75rem;
            background: #374151;
            padding: 4px 8px;
            border-radius: 999px;
            color: #fef3c7;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 999px;
        }

        @media (max-width: 860px) {
            .video-grid {
                grid-template-columns: 1fr;
            }

            iframe { height: 300px; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="container">
            <div class="card">
                <h1>Satyam Gamer 999 Official</h1>
                <p class="subtitle">Gaming, entertainment, aur YouTube ka sabse stylish home page — yahan aapko latest videos aur channel links sab kuch milta hai.</p>

                <div class="btn-row">
                    <a class="btn btn-red" href="https://youtube.com/@satyamgamer999-z5v?si=noNkXk4HtlZ2tE-I" target="_blank" rel="noopener noreferrer">Subscribe on YouTube</a>
                    <a class="btn btn-gold" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
                </div>

                <div class="social-links">
                    <a href="https://youtube.com/@satyamgamer999-z5v?si=noNkXk4HtlZ2tE-I" target="_blank" rel="noopener noreferrer">YouTube</a>
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
                    <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Facebook</a>
                </div>
            </div>

            <div class="card">
                <div class="video-grid">
                    <div>
                        <iframe id="featured-video" src="https://www.youtube.com/embed/nEJcs4_USUE?rel=0&modestbranding=1"
                                title="Latest video from Satyam Gamer 999"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen></iframe>
                    </div>
                    <div>
                        <div class="video-list" id="feed-list"></div>
                    </div>
                </div>
                <p id="feed-status" class="subtitle" style="margin-top: 16px;">Loading latest uploads from your channel...</p>
            </div>
        </div>
    </section>

    <script>
        const channelFeedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=UCov21gaqZQzYRGRc23NhZsQ');
        const featuredFrame = document.getElementById('featured-video');
        const feedList = document.getElementById('feed-list');
        const feedStatus = document.getElementById('feed-status');

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function extractVideoId(link) {
            const watchMatch = link.match(/[?&]v=([A-Za-z0-9_-]{11})/);
            if (watchMatch) return watchMatch[1];
            const shortMatch = link.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
            if (shortMatch) return shortMatch[1];
            return null;
        }

        function getVideoLabel(link) {
            return link.includes('/shorts/') ? 'Short' : 'Video';
        }

        function buildEmbedUrl(videoId) {
            return `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1`;
        }

        fetch(channelFeedUrl)
            .then(response => response.json())
            .then(data => {
                if (!data.items || !data.items.length) throw new Error('No items');

                const items = data.items.filter(item => item.link);
                const latest = items[0];
                const latestVideoId = extractVideoId(latest.link);

                if (featuredFrame && latestVideoId) {
                    featuredFrame.src = buildEmbedUrl(latestVideoId);
                }

                if (feedList) {
                    feedList.innerHTML = '';
                    items.slice(0, 8).forEach(item => {
                        const videoId = extractVideoId(item.link);
                        const thumb = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : (item.thumbnail || '');
                        const safeTitle = escapeHtml(item.title || 'YouTube content');
                        const safeLink = escapeHtml(item.link);
                        const safeLabel = escapeHtml(getVideoLabel(item.link));

                        const card = document.createElement('div');
                        card.className = 'video-item';
                        card.innerHTML = `
                            <div class="thumb-box">
                                ${thumb ? `<img src="${thumb}" alt="${safeTitle}">` : ''}
                            </div>
                            <div class="video-info">
                                <span class="tag">${safeLabel}</span>
                                <strong>${safeTitle}</strong>
                                <a href="${safeLink}" target="_blank" rel="noopener noreferrer">Watch now</a>
                            </div>
                        `;
                        feedList.appendChild(card);
                    });
                }

                if (feedStatus) {
                    feedStatus.textContent = 'Latest uploads and shorts are shown automatically from your channel.';
                }
            })
            .catch(() => {
                if (feedStatus) {
                    feedStatus.textContent = 'Unable to load your latest videos right now. Please refresh the page.';
                }
            });
    </script>
</body>
</html>
